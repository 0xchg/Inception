networks:
  inception-net:
    driver: bridge

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - inception-net
    env_file: .env
    restart: unless-stopped
    secrets:
      - db_password
      - db_root_password

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    depends_on:
      - mariadb
      - redis
    volumes:
      - wp-files:/var/www/html
    networks:
      - inception-net
    env_file: .env
    restart: unless-stopped 
    secrets:
      - db_password
      - wp_user_password
      - wp_admin_password

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wp-files:/var/www/html
    networks:
      - inception-net
    restart: unless-stopped

  redis:
    build: ./bonus/redis
    container_name: redis
    networks:
      - inception-net
    restart: unless-stopped

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  wp-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

