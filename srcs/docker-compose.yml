networks:
  inception-net:
    driver: bridge

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - inception-net
    env_file: .env
    restart: unless-stopped 

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    depends_on:
      - mariadb
    #volumes:
    networks:
      - inception-net
    env_file: .env
    restart: unless-stopped  

  #nginx:


volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  # wp-files:
